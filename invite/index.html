<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Set your password</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
        background: #f5f6f8;
        color: #1c1c1c;
      }
      main {
        box-sizing: border-box;
        max-width: 24rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        margin: 1.5rem 0 1rem;
        font-size: 1.5rem;
      }
      #invite-status {
        margin: 0 0 1rem;
        min-height: 1.5rem;
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem 0.625rem;
        font: inherit;
        color: inherit;
        background: #ffffff;
        border: 1px solid #6b7075;
        border-radius: 4px;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        padding: 0.625rem 1rem;
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #1a5fb4;
        border: 1px solid #1a5fb4;
        border-radius: 4px;
        cursor: pointer;
      }
      input:disabled,
      button:disabled {
        cursor: default;
        opacity: 0.7;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #1a5fb4;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #16181c;
          color: #f2f2f2;
        }
        input {
          background: #24272c;
          border-color: #8b9198;
        }
        button {
          background: #4a8ee0;
          border-color: #4a8ee0;
          color: #101216;
        }
      }
      @media (forced-colors: active) {
        input,
        button {
          border: 1px solid ButtonBorder;
          background: ButtonFace;
          color: ButtonText;
          opacity: 1;
        }
        input:focus-visible,
        button:focus-visible {
          outline: 2px solid Highlight;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Set your password</h1>
      <p id="invite-status" role="status" aria-live="polite"></p>
      <form id="invite-form" hidden novalidate>
        <label for="invite-password">Password</label>
        <input id="invite-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
        <label for="invite-confirm">Confirm password</label>
        <input id="invite-confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
        <button type="submit">Set password</button>
      </form>
    </main>
    <script>
      (function () {
        // The only shapes this page understands. The token grammar is repeated
        // verbatim by /api/accept, whose copy is the authoritative one; this
        // check exists so a malformed link never reaches the network at all.
        var TOKEN = /^#recovery_token=([A-Za-z0-9._~-]{20,4096})$/;
        var PATH = "/invite/";
        var TIMEOUT_MS = 10000;
        var MIN_POINTS = 12;
        var MAX_POINTS = 128;
        var MIN_BYTES = 12;
        var MAX_BYTES = 512;

        var OFF_SITE = "This invitation page is available on the connected site.";
        var UNUSABLE = "This invitation link cannot be used. Request a new invitation.";
        var READY = "Choose a password to finish signing in.";
        var LOCAL_INVALID = "Use 12–128 characters, and enter the same password twice.";
        var WORKING = "Setting your password…";
        var DONE = "Password set. Open the document URL shared by the owner.";
        var FAILED = "This invitation could not be completed. Ask the owner to resend the setup link.";

        // The recovery token lives here and nowhere else: never in the DOM, an
        // attribute, the URL, a global, storage or a log. It is overwritten
        // with null the moment a submission settles, whatever the outcome.
        var token = null;
        var payload = null;
        var attempted = false;
        var active = null;

        var status = null;
        var form = null;
        var password = null;
        var confirm = null;
        var submit = null;

        function say(text) {
          status.textContent = text;
        }

        /** True for an ASCII C0 control, DEL, or a C1 control. */
        function hasControl(value) {
          for (var index = 0; index < value.length; index += 1) {
            var code = value.charCodeAt(index);
            if (code <= 0x1f || code === 0x7f || (code >= 0x80 && code <= 0x9f)) {
              return true;
            }
          }
          return false;
        }

        /** True when any UTF-16 surrogate in the string is unpaired. */
        function hasLoneSurrogate(value) {
          for (var index = 0; index < value.length; index += 1) {
            var code = value.charCodeAt(index);
            if (code >= 0xd800 && code <= 0xdbff) {
              var next = index + 1 < value.length ? value.charCodeAt(index + 1) : 0;
              if (next < 0xdc00 || next > 0xdfff) return true;
              index += 1;
            } else if (code >= 0xdc00 && code <= 0xdfff) {
              return true;
            }
          }
          return false;
        }

        /**
         * The exact password boundary. It is deliberately duplicated on the
         * server, which decides; this copy only keeps a hopeless value off the
         * network. Nothing is trimmed, normalized or case-folded.
         */
        function passwordAllowed(value, repeat) {
          if (typeof value !== "string" || typeof repeat !== "string") return false;
          if (value !== repeat) return false;
          if (hasLoneSurrogate(value) || hasControl(value)) return false;
          var points = 0;
          for (var iterator = value[Symbol.iterator](), step = iterator.next();
               !step.done; step = iterator.next()) {
            points += 1;
            if (points > MAX_POINTS) return false;
          }
          if (points < MIN_POINTS) return false;
          var bytes = new TextEncoder().encode(value).length;
          return bytes >= MIN_BYTES && bytes <= MAX_BYTES;
        }

        /** Disable every control and keep the form out of the accessibility tree. */
        function seal() {
          password.disabled = true;
          confirm.disabled = true;
          submit.disabled = true;
          form.hidden = true;
        }

        function onSubmit(event) {
          event.preventDefault();
          if (attempted || active !== null || token === null) return;

          var candidate = password.value;
          var repeat = confirm.value;
          if (!passwordAllowed(candidate, repeat)) {
            candidate = "";
            repeat = "";
            say(LOCAL_INVALID);
            return;
          }

          // Past this point exactly one request is ever issued, and the token
          // does not survive its settlement even if the request fails.
          attempted = true;
          password.disabled = true;
          confirm.disabled = true;
          submit.disabled = true;
          form.setAttribute("aria-busy", "true");
          say(WORKING);

          var controller = new AbortController();
          active = controller;
          var timer = setTimeout(function () {
            controller.abort();
          }, TIMEOUT_MS);

          payload = JSON.stringify({ token: token, password: candidate });
          candidate = "";
          repeat = "";

          // One settlement path, whatever the outcome. The token and the
          // serialized body are erased here and never retained for a retry.
          var settle = function () {
            clearTimeout(timer);
            active = null;
            payload = null;
            token = null;
            password.value = "";
            confirm.value = "";
            form.removeAttribute("aria-busy");
            seal();
          };

          fetch("/api/accept", {
            method: "POST",
            credentials: "same-origin",
            cache: "no-store",
            redirect: "error",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json"
            },
            body: payload,
            signal: controller.signal
          }).then(function (response) {
            // A body is never read. Zero application bytes are asserted from
            // the declared length when the runtime exposes one.
            var length = response.headers.get("Content-Length");
            return response.status === 204 && (length === null || length === "0");
          }, function () {
            return false;
          }).then(function (ok) {
            say(ok ? DONE : FAILED);
          }, function () {
            say(FAILED);
          }).then(settle, settle);
        }

        function start() {
          status = document.getElementById("invite-status");
          form = document.getElementById("invite-form");
          password = document.getElementById("invite-password");
          confirm = document.getElementById("invite-confirm");
          submit = form.querySelector("button");

          if (location.protocol !== "http:" && location.protocol !== "https:") {
            say(OFF_SITE);
            return;
          }
          if (location.pathname !== PATH) {
            say(OFF_SITE);
            return;
          }

          var hash = location.hash;
          var match = TOKEN.exec(hash);
          if (match === null) {
            // No URL rewrite, no listener, no request: a malformed fragment
            // leaves the page in exactly the state it loaded in.
            hash = "";
            say(UNUSABLE);
            return;
          }

          token = match[1];
          hash = "";
          match = null;

          try {
            history.replaceState(null, "", PATH);
          } catch (error) {
            token = null;
            say(UNUSABLE);
            return;
          }

          form.addEventListener("submit", onSubmit);
          say(READY);
          form.hidden = false;
          password.focus({ preventScroll: true });
        }

        addEventListener("pagehide", function () {
          if (active !== null) active.abort();
          active = null;
          token = null;
          payload = null;
          if (password !== null) password.value = "";
          if (confirm !== null) confirm.value = "";
          // A page restored from the back/forward cache has no token left, so
          // it must not present a form that would silently do nothing.
          if (form !== null && !form.hidden) {
            seal();
            say(UNUSABLE);
          }
        });

        if (document.readyState === "loading") {
          addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
