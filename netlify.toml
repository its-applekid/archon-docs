# Repo-backed Archon deploy.
#
# The builder is the published `@aiur-team/docbuild` package, not a vendored
# copy of `templates/`. The live layer under `netlify/` is vendored verbatim
# from `aiur-team/archon`, because it is not part of that package and there is
# no other way for a consumer to obtain it.
#
# `docbuild --site` walks the repository for every directory holding a
# `doc.json`, builds each one through the shared builder, and writes `_site/`
# from scratch: `_site/<slug>/index.html`, `_site/login/` and `_site/invite/`
# copied from the root trees, `_site/_redirects` with the permanent `/d/<id>`
# routes, and a generated root index.
#
# That generated root index is the one thing this repository does not want: the
# front page here is the hand-written splash in `index.html`. `scripts/
# site-splash.mjs` replaces it after the site build, and fails loudly if the
# builder ever stops emitting one, so the splash cannot be lost silently.

[build]
  command = "docbuild --site && node scripts/site-splash.mjs"
  publish = "_site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!*.md' ':!**/dist/**'"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.pending]
  included_files = ["**/dist/*.edit.json"]

# The gate fronts everything and fails closed. The exclusions are the paths
# that must answer before anybody is signed in:
#
#   "/"          the splash. It carries no `doc-id` meta line, so the gate
#                would reject it as unverifiable even for a signed-in reader.
#                This is the only added exclusion, and it is exactly one path:
#                `/how-archon-works/` and every future document stay gated.
#   "/login/*"   the sign-in page itself
#   "/api/*"     the functions, which do their own access checks
#   "/_assets/*" hashed, immutable, content-addressed assets
[[edge_functions]]
  path = "/*"
  excludedPath = ["/", "/login/*", "/api/*", "/_assets/*"]
  function = "gate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production.environment]
  DOC_ENV = "production"

[context.deploy-preview.environment]
  DOC_ENV = "preview"

[context.branch-deploy.environment]
  DOC_ENV = "preview"
